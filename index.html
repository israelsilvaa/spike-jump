<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1a5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Spike Jump: vôlei de praia para o celular. Levante, pule e corte!">
<title>Spike Jump</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏐%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--night:#1b1038;--deep:#12082e;--plum:#2a1660;--violet:#4b2fa0;--coral:#ff5a5f;--sun:#ffc145;--mist:#e8dcff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:#fff;
  font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  overscroll-behavior:none;touch-action:none}
button{font-family:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#c{display:block}

/* controles */
#controls{flex:0 0 auto;display:flex;justify-content:space-between;align-items:stretch;gap:14px;
  height:calc(180px + env(safe-area-inset-bottom));
  padding:12px 16px calc(76px + env(safe-area-inset-bottom));
  background:linear-gradient(#d9a95c,#b98443);border-top:4px solid #8a5d2a}
#pad{display:flex;gap:10px;flex:0 0 auto;touch-action:none}
.btn{display:flex;align-items:center;justify-content:center;border-radius:20px;background:var(--plum);
  border:3px solid #6d4fd0;box-shadow:0 6px 0 var(--deep);color:#fff;transition:transform .05s}
.btn svg{width:34px;height:34px;fill:#fff;pointer-events:none}
.arrow{width:78px}
.arrow.on{transform:translateY(5px);box-shadow:0 1px 0 var(--deep);background:var(--violet)}
.jump{flex:1 1 auto;max-width:210px;padding:0;gap:10px;font-size:30px;cursor:pointer;
  background:var(--coral);border-color:#ff9a9d;box-shadow:0 6px 0 #a1272c;touch-action:none}
.jump.on{transform:translateY(5px);background:#e04a50;box-shadow:0 1px 0 #a1272c}
.mute{position:absolute;right:8px;bottom:6px;width:38px;height:38px;border-radius:12px;border:2px solid #6d4fd0;
  background:rgba(42,22,96,.82);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.mute svg{width:22px;height:22px;fill:#fff;stroke:#fff}
.mute .x{display:none}
.mute.off .x{display:block}
.mute.off .wave{display:none}

/* painéis */
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(27,16,56,.72)}
.ov.show{display:flex}
.card{width:min(100%,340px);max-height:100%;overflow-y:auto;background:var(--plum);border:3px solid var(--sun);
  border-radius:24px;padding:20px 18px 16px;box-shadow:0 8px 0 var(--deep);text-align:center;touch-action:pan-y}
h1{margin:4px 0 8px;font-weight:400;font-size:60px;line-height:.92;color:var(--sun);
  text-shadow:3px 3px 0 var(--coral),6px 6px 0 var(--deep);transform:rotate(-3deg)}
h2{margin:0 0 6px;font-weight:400;font-size:34px;color:var(--sun)}
p{margin:6px 0}
.who{color:var(--mist);font-size:17px;min-height:22px}
.how{list-style:none;margin:12px 0 6px;padding:0;text-align:left;font-size:16px;line-height:1.25;color:var(--mist)}
.how li{position:relative;padding:5px 0 5px 24px}
.how li::before{content:"";position:absolute;left:3px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--sun)}
.rec{font-size:19px;color:#fff;margin:10px 0 12px}
.row{display:flex;gap:10px;justify-content:center}
.cta{flex:1;font-size:23px;border:0;border-radius:16px;padding:12px 10px;background:var(--sun);color:var(--night);
  box-shadow:0 5px 0 #b87d00;cursor:pointer}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #b87d00}
.cta.alt{background:var(--violet);color:#fff;box-shadow:0 5px 0 #25104f}
.cta.alt:active{box-shadow:0 1px 0 #25104f}
.ghost{margin-top:10px;background:none;border:0;color:#ffd9a0;font-size:16px;text-decoration:underline;padding:6px 10px;cursor:pointer}
.big{font-size:76px;line-height:1;color:#fff;text-shadow:4px 4px 0 var(--coral);margin:2px 0}
.status{min-height:44px;font-size:17px;color:var(--mist);margin:6px 0 12px}
.status strong{color:var(--sun);font-weight:400}
input{width:100%;font:inherit;font-size:26px;text-align:center;padding:10px;border-radius:14px;margin:12px 0 4px;
  border:3px solid #6d4fd0;background:var(--deep);color:#fff;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.err{min-height:22px;color:#ff9a9d;font-size:15px;margin:2px 0 8px}
.small{font-size:14px;color:#b9a6e8}

/* ranking */
.list{list-style:none;margin:10px 0 6px;padding:0;max-height:46vh;overflow-y:auto;text-align:left;touch-action:pan-y}
.list li{display:grid;grid-template-columns:36px 1fr 46px 54px;gap:4px;align-items:center;padding:8px 10px;margin:0 0 5px;
  border-radius:12px;background:rgba(255,255,255,.07);font-size:18px}
.list li .lv{font-size:13px;color:#b9a6e8;text-align:right}
.list li>span:last-child{text-align:right}
.list li.me .lv{color:#4b2fa0}
.list li .pos{color:#ffd9a0}
.list li:nth-child(1) .pos{color:var(--sun)}
.list li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li.me{background:var(--sun);color:var(--night)}
.list li.me .pos{color:var(--night)}
.list li.empty{display:block;text-align:center;font-size:17px;color:var(--mist);background:none}
.list li.gap{display:block;text-align:center;padding:0;background:none;color:#b9a6e8;margin:0 0 2px}

/* skins */
#pv{display:block;width:100%;max-width:300px;height:auto;margin:8px auto 0;border-radius:14px;border:2px solid #6d4fd0}
.tabs{display:flex;gap:6px;margin:12px 0 10px}
.tab{flex:1;font-size:14px;border:2px solid #6d4fd0;border-radius:12px;padding:8px 2px;background:var(--deep);color:var(--mist);cursor:pointer}
.tab.on{background:var(--sun);color:var(--night);border-color:var(--sun)}
.sk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.sk button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;
  border:3px solid #4b2fa0;background:rgba(255,255,255,.07);color:var(--mist);font-size:13px;cursor:pointer}
.sk button.on{border-color:var(--sun);background:rgba(255,193,69,.18);color:#fff}
.sk canvas{width:60px;height:60px;border-radius:10px;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Quadra de vôlei de praia"></canvas>

    <button id="btnMute" class="mute" type="button" aria-label="Ligar ou desligar o som">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" stroke="none"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/><path class="x" d="M16 9l5 6M21 9l-5 6" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>

    <div id="ovMenu" class="ov show"><div class="card">
      <h1>Spike<br>Jump</h1>
      <p class="who" id="menuWho"></p>
      <ul class="how">
        <li>Use ◀ ▶ para correr. A bola sobe sozinha quando bate em você.</li>
        <li>Com a bola no alto, aperte Pular e corte por cima da rede.</li>
        <li>Segure ▶ na cortada para a bola cair curta e rápida.</li>
      </ul>
      <p class="rec" id="menuBest"></p>
      <div class="row">
        <button class="cta" id="btnPlay" type="button">Jogar</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="cta alt" id="btnRank" type="button">Ranking</button>
        <button class="cta alt" id="btnSkins" type="button">Skins</button>
      </div>
      <button class="ghost" id="btnName" type="button">Trocar nome</button>
    </div></div>

    <div id="ovName" class="ov"><div class="card">
      <h2 id="nameTitle">Qual é o seu nome?</h2>
      <p class="small">Ele aparece no ranking.</p>
      <form id="formName" autocomplete="off">
        <input id="inName" type="text" maxlength="14" placeholder="Seu nome" aria-label="Seu nome" enterkeyhint="done">
        <div class="err" id="nameErr" role="alert"></div>
        <div class="row">
          <button class="cta" id="btnNameOk" type="submit">Entrar na quadra</button>
        </div>
      </form>
      <button class="ghost" id="btnNameBack" type="button" hidden>Cancelar</button>
    </div></div>

    <div id="ovOver" class="ov"><div class="card">
      <h2>Fim de jogo</h2>
      <div class="big" id="ovScore">0</div>
      <p class="small">pontos · <span id="ovLevel"></span></p>
      <div class="status" id="ovStatus" role="status"></div>
      <div class="row">
        <button class="cta" id="btnAgain" type="button">Jogar de novo</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="cta alt" id="btnRank2" type="button">Ranking</button>
        <button class="cta alt" id="btnMenu" type="button">Menu</button>
      </div>
    </div></div>

    <div id="ovSkins" class="ov"><div class="card">
      <h2>Skins</h2>
      <canvas id="pv" width="600" height="340" aria-label="Prévia das skins escolhidas"></canvas>
      <div class="tabs" id="skTabs" role="tablist">
        <button class="tab on" type="button" role="tab" data-k="ball">Bola</button>
        <button class="tab" type="button" role="tab" data-k="char">Jogador</button>
        <button class="tab" type="button" role="tab" data-k="net">Rede</button>
        <button class="tab" type="button" role="tab" data-k="scene">Cenário</button>
      </div>
      <div class="sk" id="skGrid"></div>
      <div class="row">
        <button class="cta" id="btnSkinsOk" type="button">Pronto</button>
      </div>
    </div></div>

    <div id="ovRank" class="ov"><div class="card">
      <h2>Ranking</h2>
      <ol class="list" id="rankList"></ol>
      <p class="small" id="rankInfo" role="status"></p>
      <div class="row">
        <button class="cta alt" id="btnRankRetry" type="button" hidden>Tentar de novo</button>
        <button class="cta" id="btnRankClose" type="button">Fechar</button>
      </div>
    </div></div>
  </div>

  <div id="controls">
    <div id="pad" aria-label="Mover para a esquerda ou para a direita">
      <div class="btn arrow" id="bL"><svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z"/></svg></div>
      <div class="btn arrow" id="bR"><svg viewBox="0 0 24 24"><path d="M8 4l10 8-10 8z"/></svg></div>
    </div>
    <button class="btn jump" id="bJ" type="button" aria-label="Pular">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 10h-5v8H9v-8H4z"/></svg>
      <span>Pular</span>
    </button>
  </div>
</div>

<script>
(()=>{
'use strict';

/* ================= constantes ================= */
const W=360, H=500, GROUND=400, NET_X=180, NET_TOP=GROUND-125, BR=13, G=1500;
const MAX_LIVES=3;      // máximo de vidas (as extras nunca passam disso)
const FULL_BONUS=150;   // pontos de bônus quando a vida extra vem com as vidas já cheias
const API='/.netlify/functions/ranking';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const $=id=>document.getElementById(id);

/* ================= armazenamento local ================= */
const mem={};
const LS={
  get(k,d=null){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return k in mem?mem[k]:d}},
  set(k,v){try{localStorage.setItem(k,String(v))}catch(e){mem[k]=String(v)}}
};

let hash=LS.get('sj_hash','');
if(!/^[0-9a-f]{64}$/.test(hash)) hash='';
let pname=LS.get('sj_name','');
let pid=LS.get('sj_pid','');
let best=+LS.get('sj_best',0)||0;        // melhor pontuação neste aparelho
let blevel=+LS.get('sj_blevel',0)||0;    // nível alcançado na partida do recorde
let sbest=+LS.get('sj_sbest',0)||0;      // melhor pontuação que o servidor já confirmou
let spikedEver=LS.get('sj_spiked')==='1';
let gamesPlayed=+LS.get('sj_games',0)||0;

/* ================= skins ================= */
const BALLS=[
  {id:'classica',name:'Clássica',base:'#fff6e0',kind:'stripes',c:['#ff5a5f','#14b8b0','#ffc145'],line:'#1b1038'},
  {id:'neon',name:'Neon',base:'#c8ff3a',kind:'stripes',c:['#ffffff','#ff2e93','#ffffff'],line:'#1b1038'},
  {id:'laranja',name:'Laranja',base:'#ff8a3d',kind:'seams',c:['#4a1f08'],line:'#4a1f08'},
  {id:'futebol',name:'Futebol',base:'#ffffff',kind:'soccer',c:['#222233'],line:'#1b1038'},
  {id:'galaxia',name:'Galáxia',base:'#2a1660',kind:'dots',c:['#ffd9a0','#ff9ad0','#7dfff0'],line:'#ffffff'},
  {id:'ouro',name:'Ouro',base:'#ffc145',kind:'stripes',c:['#fff3b0','#b87d00','#fff3b0'],line:'#7a4f00'},
  {id:'fogo',name:'Fogo',base:'#ff7a1a',kind:'fire',c:[],line:'#7a1d00',fx:'fire'},
  {id:'gelo',name:'Gelo',base:'#bfeaff',kind:'ice',c:[],line:'#2b6a9a',fx:'ice'},
  {id:'raio',name:'Relâmpago',base:'#2a1660',kind:'bolt',c:[],line:'#ffe14d',fx:'bolt'},
  {id:'arcoiris',name:'Arco-íris',base:'#ffffff',kind:'rainbow',c:[],line:'#1b1038',fx:'rainbow'},
  {id:'fantasma',name:'Fantasma',base:'#f4efff',kind:'ghost',c:[],line:'#5b3fc0',fx:'ghost'},
  {id:'planeta',name:'Planeta',base:'#ff9a4d',kind:'bands',c:['#e2702f','#ffc08a'],line:'#7a3a12',fx:'planet',ring:true}
];
const CHARS=[
  {id:'mare',name:'Maré',jersey:'#2a6bff',shorts:'#ffc145',skin:'#8d5a3b',hair:'#1b1038',head:'band',band:'#ffc145'},
  {id:'tropical',name:'Tropical',jersey:'#14b8b0',shorts:'#fff3d6',skin:'#c68642',hair:'#2b1608',head:'shades',band:'#ff5a5f'},
  {id:'sol',name:'Sol',jersey:'#ffc145',shorts:'#2a6bff',skin:'#f1c27d',hair:'#b5651d',head:'cap',band:'#2a6bff'},
  {id:'roxo',name:'Roxo',jersey:'#7a4bff',shorts:'#1b1038',skin:'#5a3825',hair:'#0d0620',head:'band',band:'#ff5a5f'},
  {id:'brasa',name:'Brasa',jersey:'#e8333a',shorts:'#ffffff',skin:'#e0ac69',hair:'#1b1038',head:'cap',band:'#ffffff'},
  {id:'noite',name:'Noite',jersey:'#2e2e48',shorts:'#ffc145',skin:'#8d5a3b',hair:'#1b1038',head:'shades',band:'#ffc145'},
  {id:'ninja',name:'Ninja',jersey:'#1a1a2e',shorts:'#1a1a2e',skin:'#e0ac69',hair:'#1a1a2e',head:'ninja',band:'#ff3d4a'},
  {id:'robo',name:'Robô',jersey:'#5a6a88',shorts:'#13c9e8',skin:'#aab6cc',hair:'#aab6cc',head:'robot',band:'#13e0ff'},
  {id:'astro',name:'Astronauta',jersey:'#f1f5ff',shorts:'#ff5a5f',skin:'#dfe7f7',hair:'#dfe7f7',head:'helmet',band:'#243a7a'},
  {id:'pirata',name:'Pirata',jersey:'#2b2b3a',shorts:'#7a4a1e',skin:'#c68642',hair:'#2b1608',head:'pirate',band:'#e8333a'},
  {id:'heroi',name:'Herói',jersey:'#2a6bff',shorts:'#e8333a',skin:'#e0ac69',hair:'#1b1038',head:'shades',band:'#e8333a',cape:'#e8333a'},
  {id:'rei',name:'Rei',jersey:'#7a2a9a',shorts:'#ffc145',skin:'#8d5a3b',hair:'#1b1038',head:'crown',band:'#ffc145',cape:'#b0152f'}
];
const NETS=[
  {id:'classica',name:'Clássica',post:'#3a2468',mesh:'rgba(255,255,255,.26)',line:'rgba(255,255,255,.55)',tape:'#fff',stripe:'#ff5a5f'},
  {id:'neon',name:'Neon',post:'#12082e',mesh:'rgba(61,255,230,.18)',line:'#3dffe6',tape:'#ff2e93',stripe:'#3dffe6',glow:'#3dffe6'},
  {id:'ouro',name:'Dourada',post:'#b87d00',mesh:'rgba(255,193,69,.28)',line:'#ffd36b',tape:'#ffc145',stripe:'#fff3b0'},
  {id:'madeira',name:'Madeira',post:'#7a4a1e',mesh:'rgba(90,53,18,.22)',line:'#5a3512',tape:'#e8c488',stripe:'#7a4a1e'},
  {id:'arcoiris',name:'Arco-íris',post:'#3a2468',mesh:'rgba(255,255,255,.2)',line:'#fff',tape:'#fff',stripe:'#ff5a5f',rainbow:true},
  {id:'gelo',name:'Gelo',post:'#8fd0ff',mesh:'rgba(190,235,255,.35)',line:'#e8fbff',tape:'#e8fbff',stripe:'#6cc4ff'},
  {id:'laser',name:'Laser',post:'#0b0b14',mesh:'rgba(255,40,70,.18)',line:'#ff2846',tape:'#ff2846',stripe:'#ffd0d6',glow:'#ff2846',blink:true},
  {id:'fogo',name:'Fogo',post:'#4a1a08',mesh:'rgba(255,120,20,.25)',line:'#ffb300',tape:'#ff6a00',stripe:'#fff2a8',glow:'#ff7a1a',flames:true},
  {id:'doce',name:'Doce',post:'#ffffff',candy:true,mesh:'rgba(255,170,200,.3)',line:'#ff7aa8',tape:'#ff7aa8',stripe:'#ffffff'},
  {id:'corda',name:'Corda',post:'#6b4524',mesh:'rgba(200,160,100,.18)',line:'#e8c488',tape:'#c9a063',stripe:'#6b4524',diag:true}
];
const SCENES=[
  {id:'por-do-sol',name:'Pôr do sol'},
  {id:'dia',name:'Dia de sol'},
  {id:'noite',name:'Noite'},
  {id:'chuva',name:'Tempestade',wx:'rain'},
  {id:'neve',name:'Neve',wx:'snow'},
  {id:'ginasio',name:'Ginásio'},
  {id:'espaco',name:'Espaço'}
];
const SK_LISTS={ball:BALLS,char:CHARS,net:NETS,scene:SCENES};
const pickId=(list,id)=>list.some(s=>s.id===id)?id:list[0].id;
const skin={
  ball:pickId(BALLS,LS.get('sj_sk_ball')),
  char:pickId(CHARS,LS.get('sj_sk_char')),
  net:pickId(NETS,LS.get('sj_sk_net')),
  scene:pickId(SCENES,LS.get('sj_sk_scene'))
};
const skinOf=k=>SK_LISTS[k].find(s=>s.id===skin[k])||SK_LISTS[k][0];

function makeHash(){
  const a=new Uint8Array(32);
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a);
  else for(let i=0;i<32;i++) a[i]=Math.floor(Math.random()*256);
  return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
}
function cleanName(v){
  return String(v||'').replace(/[^\p{L}\p{N} _.\-!]/gu,'').replace(/\s+/g,' ').trim().slice(0,14);
}

/* ================= som ================= */
const Snd={
  ctx:null, mute:LS.get('sj_mute')==='1',
  init(){
    if(!this.ctx){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)this.ctx=new AC()}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
  },
  tone(f0,f1,dur,type,vol,delay=0){
    if(this.mute||!this.ctx)return;
    const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.03);
  },
  noise(dur,vol,delay=0,freq=1200){
    if(this.mute||!this.ctx)return;
    const c=this.ctx,n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=buf;f.type='highpass';f.frequency.value=freq;g.gain.value=vol;
    s.connect(f);f.connect(g);g.connect(c.destination);s.start(c.currentTime+delay);
  },
  bump(){this.tone(280,130,.13,'sine',.32)},
  spike(){this.noise(.2,.4,0,900);this.tone(200,55,.22,'square',.16)},
  jump(){this.tone(320,560,.1,'sine',.12)},
  net(){this.tone(120,70,.16,'triangle',.3)},
  point(){[523,659,784].forEach((f,i)=>this.tone(f,f,.14,'triangle',.22,i*.08))},
  ace(){[523,659,784,1046].forEach((f,i)=>this.tone(f,f,.16,'square',.14,i*.07))},
  lose(){this.tone(320,80,.45,'sawtooth',.18)},
  level(){[392,523,659,784].forEach((f,i)=>this.tone(f,f,.12,'triangle',.2,i*.06))},
  thunder(){this.noise(1.1,.22,0,140);this.tone(70,38,.7,'sawtooth',.14)}
};

/* ================= estado do jogo ================= */
let state='menu', stateT=0, serveDelay=1;
let score=0, lives=3, level=1, pointsWon=0, streak=0, touches=0, rally=0;
const P={x:90,y:GROUND,vx:0,vy:0,air:false,run:0,swing:0};
const C={x:285,y:GROUND,run:0,swing:0,reactT:0,err:0,home:285,pt:0};
const B={x:130,y:GROUND-BR,vx:0,vy:0,rot:0,cd:0,live:false,last:'',cpuTouched:false,lastSpike:false};
let jumpBuf=0, shake=0, netWob=0, netT=0, bannerT=0, bannerTxt='';
let particles=[], rings=[], popups=[], trail=[];
let fxTime=0, embers=[], wxDrops=[], flash=0, flashT=6;
let touchDir=0, kL=false, kR=false;

const dirNow=()=>touchDir||((kR?1:0)-(kL?1:0));
const mult=()=>Math.min(5,1+streak);
// o adversário fica mais esperto a cada nível e a cada devolução dentro da mesma jogada
const eff=()=>level+rally*.6;
const cpuSpeed=()=>Math.min(400,120+eff()*28);
const cpuReact=()=>Math.max(.1,.65-eff()*.05);
const cpuErr=()=>Math.max(6,70-eff()*7);

/* ================= física ================= */
// tempo até a bola (saindo de y0 com velocidade vy) chegar na altura yRef
function timeToY(y0,vy,yRef){
  const disc=Math.max(0,vy*vy-2*G*(y0-yRef));
  return (-vy+Math.sqrt(disc))/G;
}
// o trajeto passa por cima da rede?
function clearsNet(x0,y0,vx,vy){
  if(Math.abs(vx)<1)return true;
  const tc=(NET_X-x0)/vx;
  if(tc<=0)return true;
  const yc=y0+vy*tc+.5*G*tc*tc;
  return yc<NET_TOP-BR-4;
}
// onde a bola passa na altura da mão do adversário
function predictIntercept(){
  let x=B.x,y=B.y,vx=B.vx,vy=B.vy;
  for(let i=0;i<240;i++){
    vy+=G/60;x+=vx/60;y+=vy/60;
    if(x<BR){x=BR;vx=Math.abs(vx)*.85}
    if(x>W-BR){x=W-BR;vx=-Math.abs(vx)*.85}
    if(vy>0&&y>=GROUND-52)return x;
  }
  return x;
}

/* ================= efeitos ================= */
function pop(t,x,y,color,size,life){popups.push({t,x,y,color:color||'#fff',size:size||22,age:0,life:life||1.1})}
function burst(x,y,n,color,spd,up){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-1,1)*spd,vy:rand(-1,.2)*spd-(up||0),life:rand(.3,.7),age:0,r:rand(2,4),color});
}
function ring(x,y,color,max){rings.push({x,y,r:6,max:max||46,age:0,life:.3,color})}

/* ================= pontuação ================= */
function addScore(base,label,x,y,color){
  const v=Math.round(base*mult());
  score+=v;
  pop((label?label+' ':'')+'+'+v,x,y,color,22);
  return v;
}

/* ================= jogador ================= */
function updatePlayer(dt){
  const d=dirNow();
  P.vx+=(d*250-P.vx)*Math.min(1,dt*14);
  P.x=clamp(P.x+P.vx*dt,22,NET_X-28);
  P.run+=Math.abs(P.vx)*dt*.09;
  P.swing=Math.max(0,P.swing-dt);
  if(jumpBuf>0)jumpBuf-=dt;
  if(!P.air&&jumpBuf>0){
    P.vy=-740;P.air=true;jumpBuf=0;Snd.jump();burst(P.x,GROUND,6,'#e8c488',90,20);
  }
  if(P.air){
    P.vy+=G*dt;P.y+=P.vy*dt;
    if(P.y>=GROUND){P.y=GROUND;P.vy=0;P.air=false;burst(P.x,GROUND,5,'#e8c488',80,10)}
  }
}

function playerTouch(){
  if(B.cd>0)return;
  const hx=P.x+4, hy=P.y-58-(P.air?10:0);
  const dx=B.x-hx, dy=B.y-hy;
  if(dx*dx+dy*dy>46*46)return;

  B.cd=.22;B.last='player';touches++;P.swing=.25;
  C.reactT=cpuReact();C.err=rand(-1,1)*cpuErr();
  const d=dirNow();
  const high=GROUND-B.y;
  const spike=P.air&&B.y<=hy+14&&high>90;

  if(spike){
    const sp=680;
    let a=clamp(.5+.3*clamp(dx/34,-1,1)+.4*d,-.15,1.1);
    let vx=sp*Math.cos(a),vy=sp*Math.sin(a);
    for(let i=0;i<40&&!clearsNet(B.x,B.y,vx,vy)&&a>-.15;i++){
      a-=.04;vx=sp*Math.cos(a);vy=sp*Math.sin(a);
    }
    B.vx=vx;B.vy=vy;B.lastSpike=true;B.cpuTouched=false;
    if(Math.random()<Math.max(.08,.28-eff()*.03))C.err=(Math.random()<.5?-1:1)*rand(62,100);   // erra a leitura
    addScore(5,'Cortada!',B.x,B.y-24,'#ffc145');
    shake=6;ring(B.x,B.y,'#ffc145',58);burst(B.x,B.y,12,'#fff3b0',220,0);
    Snd.spike();
    if(!spikedEver){spikedEver=true;LS.set('sj_spiked','1')}
  }else{
    const tx=clamp(118+clamp(dx,-30,30)+d*24,70,150);
    const vy=-800;
    const t=timeToY(B.y,vy,GROUND-110);
    B.vy=vy;B.vx=(tx-B.x)/t;B.lastSpike=false;
    ring(B.x,B.y,'#ffffff',34);
    Snd.bump();
  }
}

/* ================= adversário ================= */
function updateCPU(dt){
  C.swing=Math.max(0,C.swing-dt);
  C.pt+=dt;
  // sem bola para defender, ele anda de um lado para o outro da quadra dele
  let target=clamp(C.home+Math.sin(C.pt*1.1)*52+Math.sin(C.pt*2.7)*22,NET_X+30,W-26);
  if(state==='play'&&B.live){
    if(C.reactT>0)C.reactT-=dt;
    else{
      const x=predictIntercept();
      if(x>NET_X-4)target=clamp(x+C.err,NET_X+26,W-22);
    }
  }
  const sp=cpuSpeed()*dt;
  const d=clamp(target-C.x,-sp,sp);
  C.x=clamp(C.x+d,NET_X+26,W-22);
  C.run+=Math.abs(d)*.09;
}

function cpuTouch(){
  if(B.cd>0||B.x<NET_X+8)return;
  const hx=C.x-4, hy=C.y-58;
  const dx=B.x-hx, dy=B.y-hy;
  if(dx*dx+dy*dy>44*44)return;

  B.cd=.22;B.last='cpu';B.cpuTouched=true;B.lastSpike=false;C.swing=.25;rally++;
  let tx=rand(45,150);
  if(eff()>=3&&Math.abs(tx-P.x)<45)tx=clamp(P.x+(P.x<100?1:-1)*rand(60,90),45,150);
  const base=Math.max(640,820-eff()*14);
  let vy=-(base+rand(0,90)),t,vx;
  for(let i=0;i<10;i++){
    t=timeToY(B.y,vy,GROUND-60);vx=(tx-B.x)/t;
    if(clearsNet(B.x,B.y,vx,vy))break;
    vy-=45;
  }
  B.vx=vx;B.vy=vy;
  ring(B.x,B.y,'#ff9ad0',34);
  Snd.bump();
}

/* ================= bola ================= */
function collideNet(){
  const cx=clamp(B.x,NET_X-3,NET_X+3), cy=clamp(B.y,NET_TOP,GROUND);
  let dx=B.x-cx, dy=B.y-cy, d=Math.hypot(dx,dy);
  if(d>=BR)return;
  let nx,ny;
  if(d<.001){nx=B.vx>=0?-1:1;ny=0;B.x=NET_X+nx*(3+BR)}
  else{nx=dx/d;ny=dy/d;B.x=cx+nx*BR;B.y=cy+ny*BR}
  const vn=B.vx*nx+B.vy*ny;
  if(vn<0){
    B.vx-=1.5*vn*nx;B.vy-=1.5*vn*ny;
    if(Math.abs(vn)>140){Snd.net();netWob=1;shake=Math.max(shake,3)}
  }
  if(ny<-.8)B.vx+=(B.x-NET_X)*3+rand(-12,12);   // não fica equilibrada em cima da rede
}

function updateBall(dt){
  const steps=2,h=dt/steps;
  for(let i=0;i<steps;i++){
    B.vy+=G*h;B.x+=B.vx*h;B.y+=B.vy*h;
    if(B.x<BR){B.x=BR;B.vx=Math.abs(B.vx)*.85}
    if(B.x>W-BR){B.x=W-BR;B.vx=-Math.abs(B.vx)*.85}
    collideNet();
    if(B.y+BR>=GROUND){land();return}
  }
  B.rot+=B.vx*dt*.04;
  B.cd-=dt;
  if(Math.hypot(B.vx,B.vy)>480)trail.push({x:B.x,y:B.y,a:.5});
  playerTouch();
  if(B.live)cpuTouch();
}

function updateDead(dt){
  B.vy+=G*dt;B.x+=B.vx*dt;B.y+=B.vy*dt;
  if(B.y+BR>=GROUND){B.y=GROUND-BR;B.vy=Math.abs(B.vy)>120?-B.vy*.35:0;B.vx*=.7}
  if(B.x<BR){B.x=BR;B.vx=-B.vx*.5}
  if(B.x>W-BR){B.x=W-BR;B.vx=-B.vx*.5}
  B.rot+=B.vx*dt*.04;
}

function land(){
  const cpuSide=B.x>NET_X;
  B.y=GROUND-BR;B.live=false;B.vx*=.35;B.vy=-Math.abs(B.vy)*.3;
  burst(B.x,GROUND,10,'#e8c488',140,60);
  state='point';stateT=0;
  if(cpuSide){
    const ace=B.lastSpike&&!B.cpuTouched&&B.last==='player';
    const m=mult();
    const total=Math.round((100+Math.min(rally,10)*20+(ace?100:0))*m);
    score+=total;
    pop((ace?'ACE! ':'Ponto! ')+'+'+total,B.x,GROUND-80,ace?'#ffc145':'#fff',ace?30:26,1.4);
    if(ace){Snd.ace();shake=8}else Snd.point();
    pointsWon++;streak++;
    if(pointsWon%5===0){
      if(lives<MAX_LIVES){lives++;pop('+1 vida',P.x,GROUND-110,'#7dffb5',22,1.4)}
      else{score+=FULL_BONUS;pop('Vidas cheias! +'+FULL_BONUS,P.x,GROUND-110,'#7dffb5',20,1.4)}
    }
    const nl=1+Math.floor(pointsWon/3);
    if(nl>level){level=nl;bannerTxt='Nível '+level;bannerT=1.4;Snd.level()}
  }else{
    lives--;streak=0;
    pop('Ops!',B.x,GROUND-80,'#ff9a9d',28,1.2);
    Snd.lose();shake=7;
  }
}

/* ================= fluxo ================= */
function startRun(){
  hideOv();
  score=0;lives=MAX_LIVES;level=1;pointsWon=0;streak=0;touches=0;rally=0;
  P.x=90;P.y=GROUND;P.vy=0;P.vx=0;P.air=false;
  C.x=C.home;C.reactT=0;
  popups=[];trail=[];
  toServe(1.1);
}
function toServe(delay){state='serve';stateT=0;serveDelay=delay;B.live=false;B.cd=0;C.home=rand(250,325)}

function doServe(){
  const x0=C.x-16,y0=GROUND-96,tx=rand(55,140);
  let vy=-rand(520,640),t=timeToY(y0,vy,GROUND-60),vx=(tx-x0)/t;
  for(let i=0;i<10&&!clearsNet(x0,y0,vx,vy);i++){
    vy-=50;t=timeToY(y0,vy,GROUND-60);vx=(tx-x0)/t;
  }
  B.x=x0;B.y=y0;B.vx=vx;B.vy=vy;B.live=true;B.cd=.3;
  B.last='cpu';B.cpuTouched=true;B.lastSpike=false;rally=0;
  C.swing=.3;Snd.bump();
  state='play';stateT=0;
}

function update(dt){
  netT+=dt;netWob=Math.max(0,netWob-dt*3);shake=Math.max(0,shake-dt*30);
  bannerT=Math.max(0,bannerT-dt);
  fxTime+=dt;updateWeather(dt);emitFx();
  for(const e of embers){e.age+=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=e.ay*dt}
  embers=embers.filter(e=>e.age<e.life);
  updatePlayer(dt);
  updateCPU(dt);
  stateT+=dt;
  if(state==='play')updateBall(dt);
  else if(state==='serve'){
    B.x=C.x-16;B.y=GROUND-92+Math.sin(stateT*7)*3;B.vx=0;B.vy=0;B.rot+=dt;
    if(stateT>=serveDelay)doServe();
  }else if(state==='point'||state==='over'){
    updateDead(dt);
    if(state==='point'&&stateT>1.4){if(lives<=0)finish();else toServe(.8)}
  }else{ // menu: bola quicando sozinha
    B.vy+=G*dt;B.y+=B.vy*dt;B.x=130;B.rot+=dt*2;
    if(B.y>=GROUND-BR){B.y=GROUND-BR;B.vy=-760}
  }
  for(const p of particles){p.age+=dt;p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  particles=particles.filter(p=>p.age<p.life);
  for(const r of rings)r.age+=dt;
  rings=rings.filter(r=>r.age<r.life);
  for(const p of popups){p.age+=dt}
  popups=popups.filter(p=>p.age<p.life);
  for(const t of trail)t.a-=dt*2.6;
  trail=trail.filter(t=>t.a>0);
}

/* ================= ranking (cliente) ================= */
async function api(method,body,qs){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),9000);
  try{
    const r=await fetch(API+(qs||''),{
      method,cache:'no-store',signal:ctl.signal,
      headers:body?{'content-type':'application/json'}:undefined,
      body:body?JSON.stringify(body):undefined
    });
    if(!r.ok)throw new Error('http '+r.status);
    return await r.json();
  }finally{clearTimeout(to)}
}

// envia a pontuação (se for melhor que a já confirmada) e devolve o ranking
async function syncScore(sc,lvl){
  const pending=+LS.get('sj_pending',0)||0;
  const pendLvl=+LS.get('sj_pendlvl',0)||0;
  const useP=pending>sc;
  const send=useP?pending:sc;
  const sl=useP?pendLvl:(lvl||0);
  if(send>0&&(send>sbest||!pid)){
    try{
      const data=await api('POST',{hash,name:pname,score:send,level:sl});
      if(data.pid){pid=data.pid;LS.set('sj_pid',pid)}
      sbest=Math.max(sbest,data.best||0);LS.set('sj_sbest',sbest);
      LS.set('sj_pending',0);LS.set('sj_pendlvl',0);
      return data;
    }catch(e){
      LS.set('sj_pending',send);LS.set('sj_pendlvl',sl);
      throw e;
    }
  }
  return api('GET',null,pid?'?pid='+pid:'');
}

function rowEl(r,me){
  const li=document.createElement('li');
  if(me)li.className='me';
  const a=document.createElement('span');a.className='pos';a.textContent='#'+r.rank;
  const b=document.createElement('span');b.className='nm';b.textContent=r.name;
  const lv=+r.level||(me&&r.best===best?blevel:0);   // sem nível no servidor, usa o salvo no aparelho
  const l=document.createElement('span');l.className='lv';l.textContent=lv?'Nív '+lv:'';
  const c=document.createElement('span');c.textContent=String(r.best);
  li.append(a,b,l,c);
  return li;
}
function renderBoard(data){
  const list=$('rankList');list.textContent='';
  const rows=data.top||[];
  if(!rows.length){
    const li=document.createElement('li');li.className='empty';
    li.textContent='Ninguém no ranking ainda. Seja o primeiro!';
    list.appendChild(li);
  }
  rows.forEach(r=>list.appendChild(rowEl(r,!!pid&&r.pid===pid)));
  if(data.me&&!rows.some(r=>r.pid===data.me.pid)){
    const g=document.createElement('li');g.className='gap';g.textContent='…';
    list.appendChild(g);list.appendChild(rowEl(data.me,true));
  }
  const n=data.total||0;
  $('rankInfo').textContent=n?n+(n>1?' jogadores no ranking':' jogador no ranking'):'';
}

let rankBack='ovMenu';
async function openRank(from){
  rankBack=from;showOv('ovRank');
  $('rankList').textContent='';
  $('rankInfo').textContent='Carregando…';
  $('btnRankRetry').hidden=true;
  try{
    const data=await api('GET',null,pid?'?pid='+pid:'');
    renderBoard(data);
  }catch(e){
    $('rankInfo').textContent='Não foi possível carregar o ranking. Verifique a conexão.';
    $('btnRankRetry').hidden=false;
  }
}

async function finish(){
  state='over';
  gamesPlayed++;LS.set('sj_games',gamesPlayed);
  const reached=level;
  const record=score>best;
  if(record){best=score;blevel=reached;LS.set('sj_best',best);LS.set('sj_blevel',blevel)}
  $('ovScore').textContent=score;
  $('ovLevel').textContent='nível '+reached;
  const st=$('ovStatus');
  st.textContent='Enviando pontuação…';
  showOv('ovOver');
  try{
    const data=await syncScore(score,reached);
    const me=data.me;
    st.textContent='';
    if(me){
      const strong=document.createElement('strong');
      strong.textContent='#'+me.rank;
      st.append(record?'Novo recorde! Você está em ':'Seu recorde é '+me.best+'. Posição ',strong,' no ranking.');
    }else if(score===0){
      st.textContent='Faça pelo menos um ponto para entrar no ranking.';
    }else{
      st.textContent='Pontuação enviada.';
    }
  }catch(e){
    st.textContent='Sem conexão com o ranking. Sua pontuação será enviada na próxima partida.';
  }
}

/* ================= controles ================= */
const pad=$('pad'),bL=$('bL'),bR=$('bR'),bJ=$('bJ');
let padId=null;
function setDir(d){touchDir=d;bL.classList.toggle('on',d<0);bR.classList.toggle('on',d>0)}
function padDir(e){const r=pad.getBoundingClientRect();return (e.clientX-r.left)/r.width<.5?-1:1}
pad.addEventListener('pointerdown',e=>{
  e.preventDefault();Snd.init();
  try{pad.setPointerCapture(e.pointerId)}catch(_){}
  padId=e.pointerId;setDir(padDir(e));
});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)setDir(padDir(e))});
const padUp=e=>{if(e.pointerId===padId){padId=null;setDir(0)}};
pad.addEventListener('pointerup',padUp);
pad.addEventListener('pointercancel',padUp);
pad.addEventListener('lostpointercapture',padUp);

bJ.addEventListener('pointerdown',e=>{
  e.preventDefault();Snd.init();
  try{bJ.setPointerCapture(e.pointerId)}catch(_){}
  jumpBuf=.14;bJ.classList.add('on');
});
const jUp=()=>bJ.classList.remove('on');
bJ.addEventListener('pointerup',jUp);
bJ.addEventListener('pointercancel',jUp);
bJ.addEventListener('lostpointercapture',jUp);

window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){kL=true;e.preventDefault()}

function palm(c,x,y,h,lean,s,col){
  c.save();c.translate(x,y);
  c.fillStyle=c.strokeStyle=col||'#1d0f45';c.lineCap='round';
  c.lineWidth=7*s;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(lean*.3,-h*.6,lean,-h);c.stroke();
  c.translate(lean,-h);
  for(const deg of [-170,-140,-110,-80,-50,-20,10]){
    const a=deg*Math.PI/180,L=46*s;
    c.lineWidth=5*s;c.beginPath();c.moveTo(0,0);
    c.quadraticCurveTo(Math.cos(a)*L*.55,Math.sin(a)*L*.9-10*s,Math.cos(a)*L,Math.sin(a)*L*.6+22*s);
    c.stroke();
  }
  c.restore();
}
function pine(c,x,y,h,col,snow){
  c.save();c.translate(x,y);
  c.fillStyle='#4a3326';c.fillRect(-3,-h*.18,6,h*.18);
  for(let i=0;i<3;i++){
    const w=h*(.34-i*.07),b=-h*(.14+i*.27),t=b-h*.36;
    c.fillStyle=col;c.beginPath();c.moveTo(-w,b);c.lineTo(w,b);c.lineTo(0,t);c.closePath();c.fill();
    if(snow){c.fillStyle='#fff';c.beginPath();c.moveTo(-w*.55,b-h*.15);c.lineTo(w*.55,b-h*.15);c.lineTo(0,t);c.closePath();c.fill()}
  }
  c.restore();
}

function initWeather(){
  wxDrops=[];const t=skinOf('scene').wx;
  const n=t==='rain'?110:t==='snow'?80:0;
  for(let i=0;i<n;i++)wxDrops.push({x:rand(-40,W+40),y:rand(0,H),s:t==='rain'?rand(620,880):rand(30,70),r:rand(1.2,3),ph:rand(0,6.3)});
  flash=0;flashT=rand(3,7);
}
function updateWeather(dt){
  const t=skinOf('scene').wx;if(!t)return;
  for(const d of wxDrops){
    d.y+=d.s*dt;
    if(t==='rain'){d.x-=d.s*.14*dt;if(d.y>GROUND+90){d.y=rand(-60,-5);d.x=rand(0,W+70)}}
    else{d.x+=Math.sin(fxTime*1.3+d.ph)*20*dt;if(d.y>H+6){d.y=-6;d.x=rand(0,W)}}
  }
  if(t==='rain'){
    flash=Math.max(0,flash-dt*2.6);flashT-=dt;
    if(flashT<=0){flash=1;flashT=rand(5,11);Snd.thunder()}
  }
}
function drawWeather(){
  const t=skinOf('scene').wx;if(!t)return;
  ctx.save();
  if(t==='rain'){
    ctx.strokeStyle='rgba(210,225,255,.6)';ctx.lineWidth=1.3;ctx.beginPath();
    for(const d of wxDrops){ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-3,d.y+14)}
    ctx.stroke();
    if(flash>0){ctx.fillStyle='rgba(235,240,255,'+(flash*.55)+')';ctx.fillRect(0,0,W,H)}
  }else{
    ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();
    for(const d of wxDrops){ctx.moveTo(d.x+d.r,d.y);ctx.arc(d.x,d.y,d.r,0,6.3)}
    ctx.fill();
  }
  ctx.restore();
}
function applyScene(){renderBG();initWeather()}

function resize(){
  const r=$('stage').getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const s=Math.min(r.width/W,r.height/H);
  const cw=Math.max(1,Math.floor(W*s)),ch=Math.max(1,Math.floor(H*s));
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  bg.width=cv.width;bg.height=cv.height;
  renderBG();
}

function txt(s,x,y,size,fill,align,stroke){

function flame(a,len,w,col,r0){
  r0=r0===undefined?6:r0;
  const cx=Math.cos(a),cy=Math.sin(a),px=-cy,py=cx;
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(cx*r0+px*w,cy*r0+py*w);
  ctx.quadraticCurveTo(cx*(r0+len*.6)+px*w*1.1,cy*(r0+len*.6)+py*w*1.1,cx*(r0+len),cy*(r0+len));
  ctx.quadraticCurveTo(cx*(r0+len*.6)-px*w*1.1,cy*(r0+len*.6)-py*w*1.1,cx*r0-px*w,cy*r0-py*w);
  ctx.closePath();ctx.fill();
}
const srnd=n=>{const v=Math.sin(n*12.9898)*43758.5453;return v-Math.floor(v)};

function drawBall(x,y,rot,s,sk){
  sk=sk||skinOf('ball');
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(rot);
  const ringHalf=(a0,a1)=>{
    ctx.save();ctx.rotate(-rot-.45);ctx.lineWidth=3.2;ctx.strokeStyle='#ffe0a0';
    ctx.beginPath();ctx.ellipse(0,0,21,5.5,0,a0,a1);ctx.stroke();ctx.restore();
  };
  if(sk.ring)ringHalf(Math.PI,6.2832);
  let fill=sk.base,g;
  if(sk.kind==='fire'){
    g=ctx.createRadialGradient(0,0,1,0,0,BR);g.addColorStop(0,'#fff6a8');g.addColorStop(.45,'#ffb300');g.addColorStop(1,'#ff4a12');fill=g;
  }else if(sk.kind==='ice'){
    g=ctx.createRadialGradient(-3,-3,1,0,0,BR);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#7fd0ff');fill=g;
  }
  ctx.beginPath();ctx.arc(0,0,BR,0,6.2832);ctx.fillStyle=fill;ctx.fill();
  ctx.save();ctx.clip();
  if(sk.kind==='stripes'){
    for(let i=0;i<3;i++){ctx.rotate(Math.PI/3);ctx.fillStyle=sk.c[i];ctx.fillRect(-BR*2,-3.2,BR*4,6.4)}
  }else if(sk.kind==='rainbow'){
    const h=fxTime*140;
    for(let i=0;i<3;i++){ctx.rotate(Math.PI/3);ctx.fillStyle='hsl('+Math.floor((h+i*120)%360)+',95%,58%)';ctx.fillRect(-BR*2,-3.6,BR*4,7.2)}
  }else if(sk.kind==='seams'){
    ctx.strokeStyle=sk.c[0];ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(-BR,0);ctx.lineTo(BR,0);ctx.moveTo(0,-BR);ctx.lineTo(0,BR);ctx.stroke();
    ctx.beginPath();ctx.arc(-BR*1.55,0,BR*1.05,-1.1,1.1);ctx.stroke();
    ctx.beginPath();ctx.arc(BR*1.55,0,BR*1.05,Math.PI-1.1,Math.PI+1.1);ctx.stroke();
  }else if(sk.kind==='soccer'){
    ctx.fillStyle=sk.c[0];ctx.strokeStyle=sk.c[0];ctx.lineWidth=1.4;
    ctx.beginPath();
    for(let i=0;i<5;i++){const a=i*1.2566-1.5708;ctx.lineTo(Math.cos(a)*4.6,Math.sin(a)*4.6)}
    ctx.closePath();ctx.fill();
    for(let i=0;i<5;i++){
      const a=i*1.2566-1.5708;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*4.6,Math.sin(a)*4.6);ctx.lineTo(Math.cos(a)*8.6,Math.sin(a)*8.6);ctx.stroke();
      ctx.beginPath();ctx.arc(Math.cos(a+.6283)*BR*1.02,Math.sin(a+.6283)*BR*1.02,3.6,0,6.3);ctx.fill();
    }
  }else if(sk.kind==='dots'){
    const d=[[-5,-6,1.8],[6,-3,1.4],[-2,7,2],[8,6,1.2],[-9,2,1.3],[2,-10,1.4],[3,1,1],[-7,-9,1]];
    d.forEach((p,i)=>{ctx.fillStyle=sk.c[i%3];ctx.beginPath();ctx.arc(p[0],p[1],p[2],0,6.3);ctx.fill()});
    ctx.strokeStyle='rgba(255,154,208,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,BR*.62,.4,2.3);ctx.stroke();
  }else if(sk.kind==='fire'){
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(-3,2,7,3.4,5.6);ctx.stroke();
    ctx.beginPath();ctx.arc(4,-2,5,.3,2.4);ctx.stroke();
  }else if(sk.kind==='ice'){
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.3;ctx.beginPath();
    for(let i=0;i<6;i++){const a=i*1.0472;ctx.moveTo(Math.cos(a)*4.5,Math.sin(a)*4.5);ctx.lineTo(Math.cos(a)*BR,Math.sin(a)*BR)}
    for(let i=0;i<=6;i++){const a=i*1.0472;i?ctx.lineTo(Math.cos(a)*4.5,Math.sin(a)*4.5):ctx.moveTo(Math.cos(a)*4.5,Math.sin(a)*4.5)}
    ctx.stroke();
  }else if(sk.kind==='bolt'){
    ctx.fillStyle='#ffe14d';ctx.strokeStyle='#ffffff';ctx.lineWidth=1;ctx.beginPath();
    ctx.moveTo(4,-12);ctx.lineTo(-5,1);ctx.lineTo(-.5,1);ctx.lineTo(-4,12);ctx.lineTo(6,-3);ctx.lineTo(1,-3);
    ctx.closePath();ctx.fill();ctx.stroke();
  }else if(sk.kind==='bands'){
    for(let i=0;i<4;i++){ctx.fillStyle=sk.c[i%2];ctx.fillRect(-BR,-10+i*6.5,BR*2,3.2)}
  }else if(sk.kind==='ghost'){
    ctx.rotate(-rot);
    ctx.fillStyle='rgba(255,150,200,.55)';ctx.beginPath();ctx.arc(-7,3,2.4,0,6.3);ctx.arc(7,3,2.4,0,6.3);ctx.fill();
    ctx.fillStyle='#1b1038';ctx.beginPath();ctx.ellipse(-4,-2,2,3,0,0,6.3);ctx.ellipse(4,-2,2,3,0,0,6.3);ctx.fill();
    ctx.beginPath();ctx.ellipse(0,5.5,2.2,2.8,0,0,6.3);ctx.fill();
  }
  ctx.restore();
  ctx.beginPath();ctx.arc(0,0,BR,0,6.2832);ctx.lineWidth=2.2;ctx.strokeStyle=sk.line;ctx.stroke();
  if(sk.ring)ringHalf(0,Math.PI);
  ctx.restore();
}

// brilho/chamas atrás da bola (animado)
function ballAura(x,y,vx,vy,sk,s){
  if(!sk.fx)return;
  const sp=Math.hypot(vx,vy),t=fxTime;
  const back=sp>60?Math.atan2(vy,vx)+Math.PI:-Math.PI/2;
  const halo=(c0,c1)=>{const g=ctx.createRadialGradient(0,0,6,0,0,34);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,34,0,6.3);ctx.fill()};
  const along=(d,off)=>[Math.cos(back)*d-Math.sin(back)*off,Math.sin(back)*d+Math.cos(back)*off];
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  if(sk.fx==='fire'){
    halo('rgba(255,150,30,.55)','rgba(255,150,30,0)');
    const spd=Math.min(sp,800);
    for(let i=0;i<7;i++){
      const a=back+(i-3)*.3+Math.sin(t*9+i*1.9)*.14;
      const len=14+spd*.022+Math.sin(t*22+i*2.3)*6+(i===3?9:0)-Math.abs(i-3)*2;
      flame(a,len,6.5-Math.abs(i-3)*.7,'#ff4a12');
      flame(a,len*.7,4.2,'#ffa31a');
      flame(a,len*.42,2.4,'#fff0a0');
    }
  }else if(sk.fx==='ice'){
    halo('rgba(150,220,255,.6)','rgba(150,220,255,0)');
    for(let i=0;i<6;i++){
      const [px,py]=along(17+i*7,Math.sin(t*7+i*1.9)*(3+i*1.2));
      const r=Math.max(1.5,5-i*.6);
      ctx.fillStyle='rgba(215,244,255,'+(.9-i*.13)+')';
      ctx.beginPath();ctx.moveTo(px,py-r*1.4);ctx.lineTo(px+r,py);ctx.lineTo(px,py+r*1.4);ctx.lineTo(px-r,py);ctx.closePath();ctx.fill();
    }
  }else if(sk.fx==='bolt'){
    halo('rgba(255,225,60,.5)','rgba(122,75,255,0)');
    const fl=Math.floor(t*18);
    ctx.lineJoin='round';
    for(let k=0;k<4;k++){
      let a=srnd(fl*7+k*3.1)*6.283,r=BR-2;
      const pts=[[Math.cos(a)*r,Math.sin(a)*r]];
      for(let j=1;j<=4;j++){a+=(srnd(fl*5+k*11+j)-.5)*1.1;r+=6+srnd(fl+k*7+j*2)*4;pts.push([Math.cos(a)*r,Math.sin(a)*r])}
      for(const [w,col] of [[4,'rgba(122,75,255,.55)'],[1.8,'#fff6a0']]){
        ctx.lineWidth=w;ctx.strokeStyle=col;ctx.beginPath();
        pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
      }
    }
  }else if(sk.fx==='rainbow'){
    halo('rgba(255,255,255,.35)','rgba(255,255,255,0)');
    for(let i=0;i<9;i++){
      const [px,py]=along(15+i*5.5,Math.sin(t*8+i*.9)*4);
      ctx.fillStyle='hsla('+Math.floor((t*220+i*38)%360)+',95%,60%,'+(.85-i*.085)+')';
      ctx.beginPath();ctx.arc(px,py,Math.max(1.5,6-i*.5),0,6.3);ctx.fill();
    }
  }else if(sk.fx==='ghost'){
    halo('rgba(160,120,255,.5)','rgba(160,120,255,0)');
    for(let i=0;i<4;i++){
      const [px,py]=along(16+i*9,Math.sin(t*5+i*1.4)*5);
      ctx.fillStyle='rgba(150,110,240,'+(.38-i*.08)+')';ctx.beginPath();ctx.arc(px,py,5+i*2.4,0,6.3);ctx.fill();
    }
  }else if(sk.fx==='planet'){
    halo('rgba(255,190,120,.4)','rgba(255,190,120,0)');
    for(let i=0;i<3;i++){
      const a=t*2+i*2.1,px=Math.cos(a)*24,py=Math.sin(a)*13,r=2+Math.sin(t*6+i)*1;
      ctx.fillStyle='#fff6c8';ctx.beginPath();ctx.arc(px,py,r,0,6.3);ctx.fill();
    }
  }
  ctx.restore();
}

// partículas soltas no cenário (brasas, flocos, faíscas...)
function emitFx(){
  const sk=skinOf('ball');
  if(!sk.fx||B.y<-BR*2||embers.length>140)return;
  const fire=sk.fx==='fire',n=fire?2:1;
  for(let i=0;i<n;i++){
    if(!fire&&Math.random()>.55)continue;
    const e={x:B.x+rand(-7,7),y:B.y+rand(-7,7),vx:rand(-26,26)-B.vx*.05,vy:rand(-14,14)-B.vy*.04,ay:0,age:0,life:rand(.4,.8),r:rand(1.6,3.2),col:'#ffb300',grow:0};
    if(sk.fx==='fire'){e.vy=rand(-110,-30);e.col=['#ffb300','#ff6a00','#fff2a8','#ff3d00'][Math.floor(Math.random()*4)]}
    else if(sk.fx==='ice'){e.vy=rand(10,50);e.col='#e8fbff';e.life=rand(.6,1.1)}
    else if(sk.fx==='bolt'){e.vx=rand(-120,120);e.vy=rand(-120,120);e.col=Math.random()<.5?'#fff6a0':'#b79cff';e.life=rand(.12,.28);e.r=rand(1.2,2.2)}
    else if(sk.fx==='rainbow'){e.col='hsl('+Math.floor((fxTime*220+rand(0,120))%360)+',95%,60%)';e.vy=rand(-30,30)}
    else if(sk.fx==='ghost'){e.vy=rand(-50,-15);e.col='rgba(150,110,240,.5)';e.r=rand(3,6);e.life=rand(.5,.9);e.grow=6}
    else if(sk.fx==='planet'){e.col='#fff6c8';e.vx=rand(-20,20);e.vy=rand(-20,20);e.life=rand(.5,.9)}
    embers.push(e);
  }
}

function athlete(x,y,o){
  const up=o.air||o.swing>0;
  ctx.save();ctx.translate(x,y);ctx.scale(o.face,1);
  ctx.lineCap='round';ctx.lineJoin='round';
  const arm=(bx,by,ex,ey)=>{ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(ex,ey);ctx.stroke()};
  const wig=Math.sin(o.run);
  // pernas
  ctx.strokeStyle=o.skin;ctx.lineWidth=7;ctx.beginPath();
  if(o.air){ctx.moveTo(-5,-26);ctx.lineTo(-10,-5);ctx.moveTo(5,-26);ctx.lineTo(10,-9)}
  else{ctx.moveTo(-5,-26);ctx.lineTo(-5+wig*7,-1);ctx.moveTo(5,-26);ctx.lineTo(5-wig*7,-1)}
  ctx.stroke();
  // braço de trás
  ctx.lineWidth=6;
  if(up)arm(-3,-54,-5,-88);else arm(-3,-54,-9,-36+wig*3);
  // capa
  if(o.cape){
    const w=Math.sin(fxTime*9)*3;
    ctx.fillStyle=o.cape;ctx.beginPath();
    ctx.moveTo(-5,-58);ctx.lineTo(-28+w,-34);ctx.lineTo(-24+w*1.4,-10+w);ctx.lineTo(-9,-30);ctx.closePath();ctx.fill();
  }
  // short
  ctx.fillStyle=o.shorts;ctx.beginPath();ctx.roundRect?ctx.roundRect(-10,-37,20,16,4):ctx.rect(-10,-37,20,16);ctx.fill();
  // camisa
  ctx.fillStyle=o.jersey;ctx.beginPath();
  ctx.moveTo(-11,-58);ctx.lineTo(11,-58);ctx.lineTo(9,-34);ctx.lineTo(-9,-34);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(-10,-48,20,4);
  // braço da frente
  ctx.strokeStyle=o.skin;ctx.lineWidth=6;
  let ex,ey;
  if(o.swing>0){const t=1-o.swing;ex=-2+t*24;ey=-92+t*34}
  else if(o.air){ex=7;ey=-88}
  else{ex=9;ey=-36-wig*3}
  arm(3,-54,ex,ey);
  // cabeça
  ctx.fillStyle=o.skin;ctx.beginPath();ctx.arc(1,-69,10.5,0,6.3);ctx.fill();
  ctx.fillStyle=o.hair;ctx.beginPath();ctx.arc(1,-69,10.8,Math.PI,0);ctx.fill();
  const hd=o.head||'band',bc=o.band||'#ffc145';
  if(hd==='cap'){
    ctx.fillStyle=bc;ctx.beginPath();ctx.arc(1,-69,11.4,Math.PI,0);ctx.fill();
    ctx.fillRect(7,-71.5,10,3.2);
  }else if(hd==='ninja'){
    ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(1,-69,11.2,0,6.3);ctx.fill();
    ctx.fillStyle=o.skin;ctx.fillRect(1,-72,11,4.6);
    ctx.fillStyle=bc;ctx.fillRect(-10.5,-74,22,3.4);
    const w=Math.sin(fxTime*10)*3;
    ctx.beginPath();ctx.moveTo(-10,-74);ctx.lineTo(-23+w,-79);ctx.lineTo(-20+w,-73);ctx.lineTo(-10,-71);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-10,-72);ctx.lineTo(-24+w,-68);ctx.lineTo(-19+w,-64);ctx.lineTo(-10,-70);ctx.closePath();ctx.fill();
    ctx.fillStyle='#1b1038';ctx.beginPath();ctx.arc(6,-69.8,1.4,0,6.3);ctx.fill();
  }else if(hd==='robot'){
    ctx.fillStyle='#aab6cc';ctx.fillRect(-11,-80,23,22);
    ctx.fillStyle='#7d8aa3';ctx.fillRect(-11,-62,23,4);
    ctx.fillStyle=bc;ctx.fillRect(0,-73,12,6);
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(1.5,-72,4,1.6);
    ctx.strokeStyle='#7d8aa3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(1,-80);ctx.lineTo(1,-88);ctx.stroke();
    ctx.fillStyle=(Math.floor(fxTime*3)%2)?'#ff3d4a':'#ffb3b8';ctx.beginPath();ctx.arc(1,-89,2.6,0,6.3);ctx.fill();
  }else if(hd==='helmet'){
    ctx.fillStyle='#f4f8ff';ctx.beginPath();ctx.arc(1,-69,13.6,0,6.3);ctx.fill();
    ctx.strokeStyle='#9fb0d6';ctx.lineWidth=1.4;ctx.stroke();
    ctx.fillStyle=bc;ctx.beginPath();ctx.ellipse(4.5,-69,8.4,7.4,0,0,6.3);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(2,-72,2.6,1.4,-.5,0,6.3);ctx.fill();
  }else if(hd==='pirate'){
    ctx.fillStyle='#e8333a';ctx.beginPath();ctx.arc(1,-69,11.4,Math.PI,0);ctx.fill();
    ctx.beginPath();ctx.moveTo(-10,-72);ctx.lineTo(-18,-66);ctx.lineTo(-17,-72);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';
    for(const [dx,dy] of [[-4,-76],[3,-78],[8,-74]]){ctx.beginPath();ctx.arc(dx,dy,1.2,0,6.3);ctx.fill()}
    ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-9,-71);ctx.lineTo(6,-67);ctx.stroke();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(6,-67,3,0,6.3);ctx.fill();
  }else if(hd==='crown'){
    ctx.fillStyle='#ffc145';ctx.beginPath();
    ctx.moveTo(-8,-77);ctx.lineTo(-9,-90);ctx.lineTo(-4,-84);ctx.lineTo(1,-92);ctx.lineTo(6,-84);ctx.lineTo(11,-90);ctx.lineTo(10,-77);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff3d4a';ctx.beginPath();ctx.arc(1,-81,1.8,0,6.3);ctx.fill();
  }else{
    ctx.fillStyle=bc;ctx.fillRect(-9.5,-71,21,3.4);
  }
  if(hd==='shades'){
    ctx.fillStyle='#120a2a';ctx.fillRect(2,-70,10,4.6);
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(3.4,-69.2,2.4,1.2);
  }else if(hd==='band'||hd==='cap'||hd==='crown'){
    ctx.fillStyle='#1b1038';ctx.beginPath();ctx.arc(5.5,-67,1.5,0,6.3);ctx.fill();
  }
  ctx.restore();
}

function netDraw(sk,x,top,ground,px){
  if(sk.candy){
    for(let y=top-7,k=0;y<ground+2;y+=8,k++){ctx.fillStyle=k%2?'#ff4d6d':'#ffffff';ctx.fillRect(px-2,y,4,Math.min(8,ground+2-y))}
  }else{ctx.fillStyle=sk.post;ctx.fillRect(px-2,top-7,4,ground-top+9)}
  ctx.fillStyle=sk.mesh;ctx.fillRect(x-5,top,10,ground-top);
  ctx.lineWidth=1;
  if(sk.glow){ctx.shadowColor=sk.glow;ctx.shadowBlur=7}
  if(sk.rainbow){
    let i=0;
    for(let y=top+8;y<ground;y+=10,i++){
      ctx.strokeStyle='hsl('+((i*38)%360)+',90%,62%)';
      ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.stroke();
    }
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.beginPath();
    ctx.moveTo(x-1.5,top);ctx.lineTo(x-1.5,ground);ctx.moveTo(x+1.5,top);ctx.lineTo(x+1.5,ground);
    ctx.stroke();
  }else if(sk.diag){
    ctx.strokeStyle=sk.line;ctx.lineWidth=1.6;ctx.beginPath();
    for(let y=top;y<ground-4;y+=10){ctx.moveTo(x-5,y);ctx.lineTo(x+5,y+10);ctx.moveTo(x+5,y);ctx.lineTo(x-5,y+10)}
    ctx.stroke();
  }else{
    if(sk.blink)ctx.globalAlpha=.6+.4*Math.sin(fxTime*16);
    ctx.strokeStyle=sk.line;ctx.beginPath();
    for(let y=top+8;y<ground;y+=10){ctx.moveTo(x-5,y);ctx.lineTo(x+5,y)}
    ctx.moveTo(x-1.5,top);ctx.lineTo(x-1.5,ground);ctx.moveTo(x+1.5,top);ctx.lineTo(x+1.5,ground);
    ctx.stroke();ctx.globalAlpha=1;
  }
  ctx.shadowBlur=0;ctx.shadowColor='transparent';
  ctx.fillStyle=sk.tape;ctx.fillRect(x-6,top-3,12,6);
  ctx.fillStyle=sk.stripe;ctx.fillRect(x-6,top-3,12,2);
  if(sk.flames){
    for(let i=-1;i<=1;i++){
      const L=12+Math.sin(fxTime*18+i*2)*5;
      ctx.save();ctx.translate(x+i*4,top-3);
      flame(-Math.PI/2,L,3.4,'#ff4a12',0);flame(-Math.PI/2,L*.6,2.2,'#ffb300',0);
      ctx.restore();
    }
  }
}

function hint(){
  if(spikedEver||state==='menu'||state==='over')return;
  let s='';
  if(touches===0&&(state==='serve'||state==='play'))s='Chegue embaixo da bola';
  else if(touches>0&&state==='play'&&B.last==='player')s='Bola no alto? Pule e corte!';
  if(!s)return;
  txt(s,W/2,GROUND+64,19,'#fff','center');
}

function hud(){
  txt(String(score),14,44,40,'#fff');
  txt('Nível '+level,14,64,16,'#ffd9a0');
  for(let i=0;i<MAX_LIVES;i++){
    const x=W-18-i*24,y=26;
    if(i<lives)drawBall(x,y,0,.8);
    else{ctx.beginPath();ctx.arc(x,y,BR*.8,0,6.3);ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.45)';ctx.stroke()}
  }
  if(mult()>1)txt('Combo ×'+mult(),W-14,60,19,'#ffc145','right');
  if(state==='serve'&&stateT<serveDelay)txt('Prepare-se!',W/2,150,34,'#fff','center');
  if(bannerT>0){
    const a=Math.min(1,bannerT*2),s=1+(1.4-bannerT)*.08;
    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,200);ctx.scale(s,s);
    txt(bannerTxt,0,0,46,'#ffc145','center');ctx.restore();
  }
}

function draw(){
  const k=cv.width/W;
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);
  ctx.setTransform(k,0,0,k,0,0);
  ctx.save();
  if(shake>0)ctx.translate(rand(-1,1)*shake,rand(-1,1)*shake);

  shadow(P.x,GROUND-P.y,17);shadow(C.x,0,17);
  shadow(B.x,Math.max(0,GROUND-B.y),12);

  athlete(C.x,C.y,{face:-1,jersey:'#ff2e93',shorts:'#fff3d6',skin:'#f1c27d',hair:'#7a2a12',air:false,run:C.run,swing:C.swing/.25});
  drawNet();
  athlete(P.x,P.y,Object.assign({},skinOf('char'),{face:1,air:P.air,run:P.run,swing:P.swing/.25}));

  for(const t of trail){ctx.globalAlpha=Math.max(0,t.a);drawBall(t.x,t.y,0,.9)}
  ctx.globalAlpha=1;
  for(const e of embers){
    const f=Math.max(0,1-e.age/e.life);
    ctx.globalAlpha=f;ctx.fillStyle=e.col;ctx.beginPath();
    ctx.arc(e.x,e.y,Math.max(.5,e.r*(1-(1-f)*.5)+e.age*e.grow),0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(B.y>-BR*2){drawBallFx(B.x,B.y,B.rot,1,B.vx,B.vy,skinOf('ball'))}
  else{ // bola acima da tela: seta no topo
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(B.x,4);ctx.lineTo(B.x-8,18);ctx.lineTo(B.x+8,18);ctx.closePath();ctx.fill();
  }

  for(const r of rings){
    const t=r.age/r.life;ctx.globalAlpha=1-t;ctx.strokeStyle=r.color;ctx.lineWidth=4*(1-t)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r+(r.max-r.r)*t,0,6.3);ctx.stroke();
  }
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,1-p.age/p.life);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  drawWeather();

  hud();hint();
  for(const p of popups){
    const t=p.age/p.life;
    ctx.globalAlpha=t>.7?1-(t-.7)/.3:1;
    txt(p.t,clamp(p.x,60,W-60),p.y-40*t,p.size,p.color,'center');
  }
  ctx.globalAlpha=1;
}

/* ================= laço principal ================= */
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.033,Math.max(0,(now-lastT)/1000));
  lastT=now;
  update(dt);draw();
  if($('ovSkins').classList.contains('show'))paintPreview();
  requestAnimationFrame(frame);
}

window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
if(window.ResizeObserver)new ResizeObserver(resize).observe($('stage'));
document.addEventListener('visibilitychange',()=>{lastT=performance.now()});

if(document.fonts&&document.fonts.load)document.fonts.load('20px "Lilita One"').catch(()=>{});
refreshMenu();
resize();
initWeather();
// se sobrou pontuação sem enviar (jogou sem internet), tenta de novo em silêncio
if(hash&&pname&&(+LS.get('sj_pending',0)||0)>0)syncScore(0).catch(()=>{});
requestAnimationFrame(frame);

})();
</script>
